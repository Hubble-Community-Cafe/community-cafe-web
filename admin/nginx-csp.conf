# Content-Security-Policy for the admin, rendered at container startup by 41-render-csp.sh into
# /etc/nginx/snippets/csp.conf: __API_ORIGIN__ becomes the origin of API_URL, and __CSP_HEADER__
# becomes Content-Security-Policy, or Content-Security-Policy-Report-Only when CSP_REPORT_ONLY=true.
#   style-src 'unsafe-inline'       : React inline styles; scripts stay 'self'.
#   img-src data:                   : inline SVG icons in CSS.
#   img-src __API_ORIGIN__          : uploaded media (board photos, logos, event images).
#   aurora-client.hubble.cafe       : Screens poster thumbnails (AURORA_POSTER_BASE_URL of the backend).
#   login.microsoftonline.com       : MSAL token requests (connect-src) and silent renewal in a hidden iframe (frame-src).
#   graph.microsoft.com             : the staff-group check in useGroupAuthorization.
#   *.sentry.io                     : error reports.
add_header __CSP_HEADER__ "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: __API_ORIGIN__ https://aurora-client.hubble.cafe; font-src 'self'; connect-src 'self' __API_ORIGIN__ https://login.microsoftonline.com https://graph.microsoft.com https://*.ingest.de.sentry.io https://*.sentry.io; frame-src 'self' https://login.microsoftonline.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
