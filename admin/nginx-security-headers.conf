# Security headers for every response, included at server level and in every location of
# nginx.conf. nginx drops inherited add_header directives in any location that sets its own (all
# of them do, for Cache-Control), so each location includes this file instead of relying on
# inheritance. One list, so a header cannot go missing from one location again.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Robots-Tag "noindex, nofollow" always;
