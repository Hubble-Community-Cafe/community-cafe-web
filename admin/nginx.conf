server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (nginx-security-headers.conf); repeated in every location below.
    include /etc/nginx/snippets/security-headers.conf;
    # No nginx version in the Server header or on error pages.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /config.js {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback. HTML is never cached so a new deploy (and config.js) is picked
    # up immediately; fingerprinted assets above stay immutably cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        # Re-included: a location with its own add_header inherits none from the server.
        include /etc/nginx/snippets/security-headers.conf;
        # Content-Security-Policy, rendered from nginx-csp.conf at container startup.
        include /etc/nginx/snippets/csp.conf;
    }

    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
