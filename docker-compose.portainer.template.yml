# Portainer deployment template for the Community Cafe Web rebuild (test.* and, later, prod).
#
# Copy to docker-compose.portainer.yml (gitignored) and fill in every __FILL_IN__ value.
#   - Replace __VERSION__ with a release tag (e.g. 0.1.0) or "latest".
#   - Images are pushed to GHCR by the release workflow.
#   - Assumes a shared MariaDB stack reachable on the external "mariadb_mariadb-network"
#     as host "mariadb" (matching the Harry List setup). Create the cafeweb database
#     and user there first.
#
# Reverse-proxy the published ports to the public hostnames:
#   admin   -> admin.test.hubble.cafe
#   hubble  -> test.hubble.cafe
#   meteor  -> test.meteor.cafe

services:
  backend:
    image: ghcr.io/hubble-community-cafe/community-cafe-web-backend:__VERSION__
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
    ports:
      - "9810:8080"
    networks:
      - cafe
      - mariadb_mariadb-network
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Europe/Amsterdam
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/cafeweb
      - SPRING_DATASOURCE_USERNAME=__DB_USERNAME__
      - SPRING_DATASOURCE_PASSWORD=__DB_PASSWORD__
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update # tighten to validate once schema is stable
      # Entra: JWT validation AND Graph form-mail (Mail.Send) reuse these credentials.
      - AZURE_TENANT_ID=__AZURE_TENANT_ID__
      - AZURE_CLIENT_ID=__AZURE_CLIENT_ID__
      - AZURE_CLIENT_SECRET=__AZURE_CLIENT_SECRET__
      # Azure object id of the first admin (only used on first-ever login)
      - INITIAL_ADMIN_OID=__INITIAL_ADMIN_OID__
      # Forms mail. provider=graph sends via Microsoft Graph; each from address must be a real,
      # sendable mailbox in the tenant. Meteor complaints send from the meteor address, Hubble
      # forms from the Hubble one. Recipients default to the lists below; override if they change.
      # Set provider=log to disable sending (e.g. while validating).
      - APP_MAIL_PROVIDER=graph
      - APP_MAIL_FROM_HUBBLE=noreply@hubble.cafe
      - APP_MAIL_FROM_METEOR=noreply@meteor.cafe
      - APP_MAIL_FORMS_COMPLAINTS=nuisance@hubble.cafe
      - APP_MAIL_FORMS_SCREENS=screens@hubble.cafe
      - APP_MAIL_FORMS_DECLARATIONS=finance@hubble.cafe
      # Comma-separated public origins
      - CORS_ALLOWED_ORIGINS=https://test.hubble.cafe,https://test.meteor.cafe,https://admin.test.hubble.cafe
      - MEDIA_DIR=/data/media
      - MEDIA_BASE_URL=https://api.test.hubble.cafe
      - SENTRY_DSN=__SENTRY_DSN_BACKEND__
      - SENTRY_ENVIRONMENT=test
    volumes:
      - cafe_media:/data/media

  public-hubble:
    image: ghcr.io/hubble-community-cafe/community-cafe-web-public-hubble:__VERSION__
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
    ports:
      - "9811:80"
    networks:
      - cafe
    environment:
      - API_URL=https://api.test.hubble.cafe
      - SENTRY_DSN=__SENTRY_DSN_PUBLIC_HUBBLE__

  public-meteor:
    image: ghcr.io/hubble-community-cafe/community-cafe-web-public-meteor:__VERSION__
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
    ports:
      - "9812:80"
    networks:
      - cafe
    environment:
      - API_URL=https://api.test.hubble.cafe
      - SENTRY_DSN=__SENTRY_DSN_PUBLIC_METEOR__

  admin:
    image: ghcr.io/hubble-community-cafe/community-cafe-web-admin:__VERSION__
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
    ports:
      - "9813:80"
    networks:
      - cafe
    environment:
      - API_URL=https://api.test.hubble.cafe
      - AZURE_CLIENT_ID=__AZURE_CLIENT_ID__
      - AZURE_TENANT_ID=__AZURE_TENANT_ID__
      - REDIRECT_URI=https://admin.test.hubble.cafe
      # Entra security group whose members may access the admin
      - ALLOWED_GROUP_ID=__AZURE_GROUP_ID__
      - SENTRY_DSN=__SENTRY_DSN_ADMIN__

volumes:
  cafe_media:

networks:
  cafe:
  mariadb_mariadb-network:
    external: true
