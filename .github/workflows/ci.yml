name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==================== TESTS ====================
  backend:
    name: Backend (Maven · JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check backend exists
        id: check
        run: test -f backend/pom.xml && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - if: steps.check.outputs.present == 'true'
        working-directory: backend
        run: ./mvnw -B test

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shared-web, public-hubble, public-meteor, admin]
    steps:
      - uses: actions/checkout@v6
      - name: Check app exists
        id: check
        run: test -f ${{ matrix.app }}/package.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      # Workspaces: install the whole tree once at the root, then run this app's
      # scripts via --workspace (there is no per-app lockfile).
      - if: steps.check.outputs.present == 'true'
        run: npm ci
      - if: steps.check.outputs.present == 'true'
        run: npm run lint --workspace @cafe/${{ matrix.app }} --if-present
      - if: steps.check.outputs.present == 'true'
        run: npm run test:run --workspace @cafe/${{ matrix.app }} --if-present
      - if: steps.check.outputs.present == 'true'
        run: npm run build --workspace @cafe/${{ matrix.app }} --if-present

  # ==================== BUILD & PUSH IMAGES (main only) ====================
  # On every push to main, after tests pass, build and push one image per service
  # to GHCR. The version comes from the root package.json (no manual git tag):
  # images are tagged :latest, :v<version>, and :main-<sha>.
  images:
    name: Build & push (${{ matrix.service }})
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The backend builds from its own folder; the frontends are an npm
          # workspace and build from the repo root (their Dockerfiles COPY the
          # root manifests + shared-web), with the Dockerfile passed via file.
          - { service: backend, context: ./backend, dockerfile: ./backend/Dockerfile }
          - { service: public-hubble, context: ., dockerfile: ./public-hubble/Dockerfile }
          - { service: public-meteor, context: ., dockerfile: ./public-meteor/Dockerfile }
          - { service: admin, context: ., dockerfile: ./admin/Dockerfile }
    steps:
      - uses: actions/checkout@v6
      - name: Resolve version and image name
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          # GHCR requires a lowercase namespace.
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:v${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
      # Image scanning is best-effort: it must not block a deploy whose images
      # have already been pushed.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ==================== GITHUB RELEASE (new version only) ====================
  # Cut a release v<version> only when that tag does not already exist, so a push
  # to main that doesn't bump the version just refreshes :latest.
  release:
    name: GitHub Release
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check if tag exists
        id: tag
        run: |
          if git ls-remote --tags origin "v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
