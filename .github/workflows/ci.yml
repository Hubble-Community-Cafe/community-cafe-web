name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Skeleton CI. Each job is guarded so it no-ops until that app is scaffolded,
# then activates automatically. Expand per app as modules land.
jobs:
  backend:
    name: Backend (Maven · JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check backend exists
        id: check
        run: test -f backend/pom.xml && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - if: steps.check.outputs.present == 'true'
        working-directory: backend
        run: ./mvnw -B test

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [public-hubble, public-meteor, admin, shared-web]
    steps:
      - uses: actions/checkout@v4
      - name: Check app exists
        id: check
        run: test -f ${{ matrix.app }}/package.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - if: steps.check.outputs.present == 'true'
        working-directory: ${{ matrix.app }}
        run: npm ci
      - if: steps.check.outputs.present == 'true'
        working-directory: ${{ matrix.app }}
        run: npm run lint --if-present
      - if: steps.check.outputs.present == 'true'
        working-directory: ${{ matrix.app }}
        run: npm run test:run --if-present
      - if: steps.check.outputs.present == 'true'
        working-directory: ${{ matrix.app }}
        run: npm run build --if-present
