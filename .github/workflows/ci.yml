name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]   # develop: integration branch, also Dependabot's target-branch

# Cancel superseded runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==================== TESTS ====================
  backend:
    name: Backend (Maven · JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check backend exists
        id: check
        run: test -f backend/pom.xml && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - if: steps.check.outputs.present == 'true'
        working-directory: backend
        run: ./mvnw -B test

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shared-web, public-hubble, public-meteor, admin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check app exists
        id: check
        run: test -f ${{ matrix.app }}/package.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json
      # Workspaces: install the whole tree once at the root, then run this app's
      # scripts via --workspace (there is no per-app lockfile).
      - if: steps.check.outputs.present == 'true'
        run: npm ci
      - if: steps.check.outputs.present == 'true'
        run: npm run lint --workspace @cafe/${{ matrix.app }} --if-present
      - if: steps.check.outputs.present == 'true'
        run: npm run test:run --workspace @cafe/${{ matrix.app }} --if-present
      - if: steps.check.outputs.present == 'true'
        run: npm run build --workspace @cafe/${{ matrix.app }} --if-present

  e2e:
    name: E2E (Playwright · full stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check e2e exists
        id: check
        run: test -f e2e/package.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - if: steps.check.outputs.present == 'true'
        name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - if: steps.check.outputs.present == 'true'
        name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      # Playwright's webServer boots the docker stack (docker-compose.e2e.yml); on CI
      # it always builds fresh (reuseExistingServer is off) with a 10-minute timeout.
      - if: steps.check.outputs.present == 'true'
        name: Run Playwright suite
        working-directory: e2e
        run: npm test
      - if: ${{ always() && steps.check.outputs.present == 'true' }}
        name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  # ==================== PUBLISH GATE (main only) ====================
  # Nothing reaches GHCR until a maintainer approves it, so a merge alone cannot
  # publish an image. Enforced by the `production` environment's required
  # reviewers (repo Settings > Environments), not by anything in this file.
  #
  # This exists as its own job purely so ONE approval releases all four image
  # builds: putting `environment:` on the matrix job below would queue a separate
  # pending deployment per service.
  approve-publish:
    name: Await publish approval
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Publishing ${{ github.sha }} approved."

  # ==================== BUILD & PUSH IMAGES (main only) ====================
  # On every push to main, after tests pass and publishing is approved, build and
  # push one image per service to GHCR. The version comes from the root
  # package.json (no manual git tag): images are tagged :latest, :v<version>,
  # and :main-<sha>.
  images:
    name: Build & push (${{ matrix.service }})
    # approve-publish already depends on the three test jobs, so ordering holds.
    needs: [approve-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The backend builds from its own folder; the frontends are an npm
          # workspace and build from the repo root (their Dockerfiles COPY the
          # root manifests + shared-web), with the Dockerfile passed via file.
          - { service: backend, context: ./backend, dockerfile: ./backend/Dockerfile }
          - { service: public-hubble, context: ., dockerfile: ./public-hubble/Dockerfile }
          - { service: public-meteor, context: ., dockerfile: ./public-meteor/Dockerfile }
          - { service: admin, context: ., dockerfile: ./admin/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve version and image name
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          # GHCR requires a lowercase namespace.
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:v${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SENTRY_ORG=stichting-bar-potential
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
      # Image scanning is best-effort: it must not block a deploy whose images
      # have already been pushed.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ==================== GITHUB RELEASE (new version only) ====================
  # Cut a release v<version> only when that tag does not already exist, so a push
  # to main that doesn't bump the version just refreshes :latest.
  release:
    name: GitHub Release
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check if tag exists
        id: tag
        run: |
          if git ls-remote --tags origin "v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

  # ==================== SENTRY RELEASE ====================
  sentry-release:
    name: Sentry Release
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create Sentry release
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: stichting-bar-potential
        with:
          projects: community-cafe-backend community-cafe-public-hubble community-cafe-public-meteor community-cafe-admin
          version: ${{ steps.version.outputs.version }}
          environment: production
