name: Release

# Builds and pushes one Docker image per deployable service to GHCR, then cuts a
# GitHub Release. Triggered by pushing a version tag (e.g. v0.1.0) or manually.
# Each service is guarded: it builds only once its Dockerfile exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, public-hubble, public-meteor, admin]
    steps:
      - uses: actions/checkout@v6
      - name: Resolve version
        id: ver
        run: echo "version=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Check Dockerfile present
        id: check
        run: test -f ${{ matrix.service }}/Dockerfile && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.present == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.check.outputs.present == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.check.outputs.present == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:latest

  release:
    name: GitHub Release
    needs: images
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
