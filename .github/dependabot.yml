version: 2
updates:
  # ── Backend (Maven) ──────────────────────────────────────────────────────────
  - package-ecosystem: "maven"
    directory: "/backend"
    target-branch: "deps"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3
    reviewers:
      - "PimVanLeeuwen"
    labels:
      - "dependencies"
      - "backend"
    # Majors are split from minor/patch so one blocked major cannot hold back
    # routine (often security) updates. See the npm "/" entry for the full rationale.
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]

  # ── Frontends (npm workspace) ────────────────────────────────────────────────
  # Single entry at the workspace root so Dependabot regenerates the shared
  # package-lock.json (in /) when it bumps any workspace member's package.json.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "deps"
    schedule: { interval: "weekly", day: "monday", time: "09:00", timezone: "Europe/Amsterdam" }
    open-pull-requests-limit: 3
    reviewers: ["PimVanLeeuwen"]
    labels: ["dependencies", "frontend"]
    # Split majors from minor/patch: a single unusable major (e.g. a bump that no
    # longer supports our toolchain) would otherwise block every routine update in
    # the same grouped PR, which is what kept this PR red for weeks.
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # typescript-eslint peers cap TypeScript at <6.1.0 (latest and canary alike),
      # so TypeScript 7 breaks `npm ci` here with an ERESOLVE peer conflict. Minor
      # and patch updates still flow. Remove this once typescript-eslint supports
      # TypeScript 7. Deliberately NOT applied to /e2e, which has no eslint and
      # already runs TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/e2e"
    target-branch: "deps"
    schedule: { interval: "weekly", day: "monday", time: "09:00", timezone: "Europe/Amsterdam" }
    open-pull-requests-limit: 3
    reviewers: ["PimVanLeeuwen"]
    labels: ["dependencies", "e2e"]
    # No TypeScript ignore here: /e2e is a separate project with its own lockfile
    # and no eslint, so it already runs TypeScript 7 without issue.
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]

  # ── GitHub Actions ────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "deps"
    schedule: { interval: "weekly", day: "monday", time: "09:00", timezone: "Europe/Amsterdam" }
    open-pull-requests-limit: 3
    reviewers: ["PimVanLeeuwen"]
    labels: ["dependencies", "ci"]
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]

  # ── Docker images ─────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directories: ["/backend", "/public-hubble", "/public-meteor", "/admin"]
    target-branch: "deps"
    schedule: { interval: "weekly", day: "monday", time: "09:00", timezone: "Europe/Amsterdam" }
    open-pull-requests-limit: 3
    reviewers: ["PimVanLeeuwen"]
    labels: ["dependencies", "docker"]
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
