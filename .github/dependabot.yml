version: 2
updates:
  # ── Backend (Maven) ──────────────────────────────────────────────────────────
  - package-ecosystem: "maven"
    directory: "/backend"
    target-branch: "deps"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3
    reviewers:
      - "PimVanLeeuwen"
    labels:
      - "dependencies"
      - "backend"
    groups:
      all-deps:
        patterns: ["*"]

  # ── Frontends (npm workspace) ────────────────────────────────────────────────
  # Single entry at the workspace root so Dependabot regenerates the shared
  # package-lock.json (in /) when it bumps any workspace member's package.json.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "deps"
    schedule: { interval: "weekly", day: "monday", time: "09:00", timezone: "Europe/Amsterdam" }
    open-pull-requests-limit: 3
    reviewers: ["PimVanLeeuwen"]
    labels: ["dependencies", "frontend"]
    groups:
      all-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/e2e"
    target-branch: "deps"
    schedule: { interval: "weekly", day: "monday", time: "09:00", timezone: "Europe/Amsterdam" }
    open-pull-requests-limit: 3
    reviewers: ["PimVanLeeuwen"]
    labels: ["dependencies", "e2e"]
    groups:
      all-deps:
        patterns: ["*"]

  # ── GitHub Actions ────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "deps"
    schedule: { interval: "weekly", day: "monday", time: "09:00", timezone: "Europe/Amsterdam" }
    open-pull-requests-limit: 3
    reviewers: ["PimVanLeeuwen"]
    labels: ["dependencies", "ci"]
    groups:
      all-deps:
        patterns: ["*"]

  # ── Docker images ─────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directories: ["/backend", "/public-hubble", "/public-meteor", "/admin"]
    target-branch: "deps"
    schedule: { interval: "weekly", day: "monday", time: "09:00", timezone: "Europe/Amsterdam" }
    open-pull-requests-limit: 3
    reviewers: ["PimVanLeeuwen"]
    labels: ["dependencies", "docker"]
    groups:
      all-deps:
        patterns: ["*"]
