# =====================================================================
# e2e profile - used ONLY by the end-to-end test stack. Never dev or prod.
# Auth is via the X-Test-Oid header bridge (see E2eSecurityConfig), so no real
# Entra tokens are needed. Activate with SPRING_PROFILES_ACTIVE=e2e.
# =====================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/cafeweb_e2e}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cafeweb}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# No external error reporting in tests.
sentry.dsn=

# Initial admin OID is injected by the e2e seed step.
app.initial-admin-oid=${INITIAL_ADMIN_OID:}

# Forms deliver to Mailpit so e2e can assert the rendered email + attachments.
app.mail.provider=smtp
app.mail.from.hubble=noreply@hubble.cafe
app.mail.from.meteor=noreply@meteor.cafe
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
