# Production configuration. All secrets come from environment variables.
spring.application.name=community-cafe-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://db:3306/cafeweb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cafeweb}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.cafe.community=${LOGGING_LEVEL_CAFE_COMMUNITY:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SPRING_SECURITY:INFO}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Server
server.port=8080
server.shutdown=graceful

# Disable Swagger UI in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Azure AD / Entra
azure.tenant-id=${AZURE_TENANT_ID}
azure.client-id=${AZURE_CLIENT_ID}
azure.client-secret=${AZURE_CLIENT_SECRET:}

app.initial-admin-oid=${INITIAL_ADMIN_OID:}

# CORS: MUST be set, comma-separated (e.g. https://test.hubble.cafe,https://test.meteor.cafe)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Sentry
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:production}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
sentry.release=community-cafe-backend@@project.version@
