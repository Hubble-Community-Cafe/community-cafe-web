spring.application.name=community-cafe-backend

# Database (MariaDB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/cafeweb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cafeweb}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_HIBERNATE_SQL:WARN}

# Azure AD / Entra (JWT validation; also used for Graph mail later)
azure.tenant-id=${AZURE_TENANT_ID:}
azure.client-id=${AZURE_CLIENT_ID:}
azure.client-secret=${AZURE_CLIENT_SECRET:}

# RBAC bootstrap: Azure OID of the first admin (only used on first-ever login)
app.initial-admin-oid=${INITIAL_ADMIN_OID:}

# CORS: comma-separated origins (public sites + admin); empty = localhost only
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Media uploads
app.media-dir=${MEDIA_DIR:${java.io.tmpdir}/cafe-media}
app.media-base-url=${MEDIA_BASE_URL:http://localhost:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Forms / staff notification mail. provider: log (default, no send) | smtp | graph (later).
app.mail.provider=${APP_MAIL_PROVIDER:log}
# From address per site: Meteor's complaints come from the meteor sender, Hubble's from Hubble.
app.mail.from.hubble=${APP_MAIL_FROM_HUBBLE:noreply@hubble.cafe}
app.mail.from.meteor=${APP_MAIL_FROM_METEOR:noreply@meteor.cafe}
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
# Per-form recipients (the mailing lists each form notifies).
app.mail.forms.complaints=${APP_MAIL_FORMS_COMPLAINTS:nuisance@hubble.cafe}
app.mail.forms.screens=${APP_MAIL_FORMS_SCREENS:screens@hubble.cafe}
app.mail.forms.declarations=${APP_MAIL_FORMS_DECLARATIONS:finance@hubble.cafe}
app.mail.forms.declarations-cc=${APP_MAIL_FORMS_DECLARATIONS_CC:}
app.mail.forms.information=${APP_MAIL_FORMS_INFORMATION:info@hubble.cafe}
app.mail.forms.loan=${APP_MAIL_FORMS_LOAN:loan@hubble.cafe}
# Microsoft Graph credentials for prod mail (reuses the Entra app + its Mail.Send grant).
app.mail.graph.tenant-id=${AZURE_TENANT_ID:}
app.mail.graph.client-id=${AZURE_CLIENT_ID:}
app.mail.graph.client-secret=${AZURE_CLIENT_SECRET:}

# ALTCHA (self-hosted proof-of-work) bot protection on the public forms. Disabled unless
# enabled with a stable secret; enable in prod. No cookies, no third party.
app.altcha.enabled=${APP_ALTCHA_ENABLED:false}
app.altcha.hmac-key=${APP_ALTCHA_HMAC_KEY:}
app.altcha.max-number=${APP_ALTCHA_MAX_NUMBER:50000}
app.altcha.expiry-seconds=${APP_ALTCHA_EXPIRY_SECONDS:300}

# Aurora narrowcasting (screen scene panel). Disabled unless a base URL + integration key are
# set; the key belongs to an Aurora integration user scoped to getScreenHandlers,
# setScreenHandler and showStaticPoster. Server-to-server only: Aurora's CORS never allows a
# browser to send x-api-key or a JSON body, whatever its CORS_ORIGINS says.
app.aurora.enabled=${AURORA_ENABLED:false}
app.aurora.base-url=${AURORA_BASE_URL:}
app.aurora.api-key=${AURORA_API_KEY:}
app.aurora.timeout-ms=${AURORA_TIMEOUT_MS:5000}
# Poster images are served by the Aurora *client* host, not the API host, and are public
# (no key needed). file.location from the API is appended to this to build a thumbnail URL.
app.aurora.poster-base-url=${AURORA_POSTER_BASE_URL:}
# Aurora handler class names, overridable so an upstream rename does not need a redeploy here.
app.aurora.handler.carousel=${AURORA_SCREEN_HANDLER_CAROUSEL:CarouselPosterHandler}
app.aurora.handler.static-poster=${AURORA_SCREEN_HANDLER_STATIC_POSTER:StaticPosterHandler}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# The SMTP server is only reachable when forms mail is configured; don't fail health on it.
management.health.mail.enabled=false

# Sentry (disabled in dev: blank DSN)
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
