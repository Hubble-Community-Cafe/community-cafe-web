# Test profile: in-memory H2, schema auto-created and dropped per run.
spring.datasource.url=jdbc:h2:mem:cafeweb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# No Entra tenant in tests; authentication is injected directly by the tests.
azure.tenant-id=
azure.client-id=
sentry.dsn=
