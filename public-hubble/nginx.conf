# Canonical host. A dozen alias domains (ducksandbears.cafe, hubblecafe.nl, barpotential.nl and
# friends) resolve to this same container, so a visitor landing on one got a site that looked
# fine but whose every API call was rejected: the backend allowlists the canonical origins only,
# so the menu, opening hours and status banner all failed with a CORS 403. Sending aliases to the
# canonical host fixes that, and stops search engines indexing the site under a dozen names.
#
# Hosts that must NOT redirect: the canonical apex itself, the test environment, and the loopback
# names used by local dev, the container health check and the Playwright e2e stack (which calls
# 127.0.0.1 rather than localhost). Any host added to the certificate later is covered by default.
map $host $canonical_redirect {
    default           https://hubble.cafe;
    hubble.cafe       "";
    test.hubble.cafe  "";
    localhost         "";
    127.0.0.1         "";
    ""                "";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Emit relative Location headers for the redirects below. nginx builds absolute ones from
    # $scheme, which is http inside the container behind the TLS proxy, so every old permalink
    # used to bounce the visitor through a plaintext http hop first. A relative Location keeps
    # them on https. The explicit absolute redirects (canonical host, harry.hubble.cafe) are
    # unaffected.
    absolute_redirect off;

    # 301 redirects from the old WordPress permalinks to the new SPA routes. The trailing-slash
    # rule at the end normalises any remaining old (slash-terminated) URL to its slashless route.
    rewrite ^/associations/?$                 /community/associations      permanent;
    rewrite ^/committees/?$                   /community/committees        permanent;
    rewrite ^/board/?$                        /community/board             permanent;
    rewrite ^/previous-boards/?$              /community/board/previous    permanent;
    rewrite ^/supervisory-board/?$            /community/board/supervisory permanent;
    rewrite ^/contact/tips-complaints-ideas/?$ /contact/tips               permanent;
    rewrite ^/contact/information-form/?$     /contact/information         permanent;
    rewrite ^/contact/event/?$                https://harry.hubble.cafe    permanent;
    rewrite ^/discount-policy/?$              /cafe/discount-policy        permanent;
    rewrite ^/daily-dinner-dish/?$            /cafe/daily-dish             permanent;
    rewrite ^/online-declarations/?$          /contact/declarations        permanent;
    rewrite ^/menu/?$                         /cafe/menu                   permanent;
    rewrite ^/screens/?$                      /contact/screens             permanent;
    rewrite ^/loan-equipment/?$               /contact/loan-equipment      permanent;
    rewrite ^/jobs/?$                         /vacancies                   permanent;
    rewrite ^/(.+)/$                          /$1                          permanent;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Cache fingerprinted static assets aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # config.js is rewritten per environment; never cache it.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback. HTML is never cached so a new deploy (and config.js) is picked
    # up immediately; fingerprinted assets above stay immutably cached.
    location / {
        # Alias domains land on the canonical host before any page is served (see the map above).
        # Deliberately scoped to this location: the health check and the fingerprinted assets keep
        # answering on every host, whatever a monitor or orchestrator sends as its Host header.
        if ($canonical_redirect) {
            return 301 $canonical_redirect$request_uri;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        # Repeat the security headers here: nginx drops inherited add_header directives in any
        # location that sets its own, so the HTML document needs them re-declared.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Content-Security-Policy. __API_ORIGIN__ is substituted from API_URL at container startup
        # (entrypoint), so the api host matches the environment (localhost, test, or the live apex).
        # 'unsafe-inline' is style-only (React inline styles + the ALTCHA widget); scripts stay 'self'.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: __API_ORIGIN__; font-src 'self'; connect-src 'self' __API_ORIGIN__ https://food.hubble.cafe https://*.ingest.de.sentry.io https://*.sentry.io; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain always;
    }
}
